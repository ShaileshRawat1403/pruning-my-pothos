name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Pinned Vale (3.17.0)
        run: |
          mkdir -p /tmp/vale-install
          curl -sL https://github.com/vale-cli/vale/releases/download/v3.17.0/vale_3.17.0_Linux_64-bit.tar.gz | tar -xz -C /tmp/vale-install
          sudo mv /tmp/vale-install/vale /usr/local/bin/vale
          vale --version

      - run: npm ci
      - run: npm run lint
      - run: npm run test:contract
      - run: npm run lint:content
      - run: npm run lint:systems:advisory
      - run: npm run report:systems
      - run: npm run lint:systems
      - run: npm run verify:covers
      - run: npm run build
      - run: npm run audit
