name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:content
      - run: npm run lint:systems:advisory
      - run: npm run report:systems
      - run: npm run lint:systems
      - run: npm run verify:covers
      - run: npm run build
