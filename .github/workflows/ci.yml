name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Vale
        uses: vale-cli/vale-action@v3
        with:
          version: 3.17.0

      - name: Add Vale to PATH
        run: echo "/opt/hostedtoolcache/vale/3.17.0/x64" >> $GITHUB_PATH

      - run: npm ci
      - run: npm run lint
      - run: npm run test:contract
      - run: npm run lint:content
      - run: npm run lint:systems:advisory
      - run: npm run report:systems
      - run: npm run lint:systems
      - run: npm run verify:covers
      - run: npm run build
      - run: npm run audit
