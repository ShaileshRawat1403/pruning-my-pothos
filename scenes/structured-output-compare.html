<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unstructured vs. Structured Output</title>
<link rel="stylesheet" href="/scenes/ink-style.css"/>
</head>
<body><div class="stage"><svg id="s" viewBox="0 0 900 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="/scenes/ink-lib.js"></script>
<script>
(function(){
  var svg = Ink.svg('0 0 900 240');

Ink.text(svg,{x:40,y:60,text:'Unstructured Text:',size:13});
Ink.rect(svg,{x:40,y:70,w:300,h:80,r:10,seed:1});
Ink.text(svg,{x:60,y:95,text:'"The capital of France is Paris."',size:12,cls:'label'});
Ink.text(svg,{x:500,y:60,text:'Structured JSON:',size:13});
Ink.rect(svg,{x:500,y:70,w:360,h:120,r:10,seed:2,cls:'ink ink-2',hi:true});
Ink.text(svg,{x:520,y:95,text:'{',size:12,cls:'label'});
Ink.text(svg,{x:540,y:115,text:'"country": "France",',size:12,cls:'label'});
Ink.text(svg,{x:540,y:135,text:'"capital": "Paris"',size:12,cls:'label'});
Ink.text(svg,{x:520,y:155,text:'}',size:12,cls:'label'});
  Ink.run();
})();
</script>
</body></html>
