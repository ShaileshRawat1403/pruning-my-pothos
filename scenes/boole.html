<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>George Boole — laws of thought</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
  .stage{position:absolute;inset:0}.stage svg{width:100%;height:100%;display:block}
  .ink{stroke:#2a2012;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .ink-2{stroke:#8c2f23}.ink-3{stroke:#9a7322}.fillink{fill:#2a2012;stroke:none}
  html[data-theme='dark'] .ink{stroke:#efe5cf}html[data-theme='dark'] .ink-2{stroke:#c2564a}
  html[data-theme='dark'] .ink-3{stroke:#c79a3e}html[data-theme='dark'] .fillink{fill:#efe5cf}
  .g0{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#2a2012;opacity:.9}
  .g1{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#8c2f23;opacity:.9}
  html[data-theme='dark'] .g0{fill:#b7a685}html[data-theme='dark'] .g1{fill:#c79a3e}
  .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
  .rise{animation:rise 7s ease-in-out infinite}
  @keyframes rise{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-8px);opacity:.5}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none}}
</style></head>
<body><div class="stage">
<svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!-- binary rising from thought into logic -->
  <g font-size="20">
    <text class="g1 rise" x="150" y="150">1</text><text class="g0 rise" x="196" y="196" style="animation-delay:-1s">0</text>
    <text class="g0 rise" x="150" y="250" style="animation-delay:-2s">0</text><text class="g1 rise" x="206" y="300" style="animation-delay:-3s">1</text>
    <text class="g1 rise" x="150" y="352" style="animation-delay:-4s">1</text><text class="g0 rise" x="200" y="404" style="animation-delay:-2.5s">0</text>
    <text class="g0 rise" x="150" y="456" style="animation-delay:-1.5s">0</text>
  </g>

  <!-- input wires -->
  <g class="ink ink-3" stroke-width="1.6">
    <path class="draw" d="M 240 250 L 470 250"/>
    <path class="draw" d="M 240 360 L 470 360"/>
    <circle class="fillink" cx="240" cy="250" r="4"/><circle class="fillink" cx="240" cy="360" r="4"/>
  </g>
  <text class="g0" x="252" y="242" font-size="15">A</text>
  <text class="g1" x="252" y="352" font-size="15">B</text>

  <!-- the AND gate: true and false, enough to build a universe -->
  <path class="ink ink-2 draw" stroke-width="2.6" d="M 470 210 L 512 210 A 95 95 0 0 1 512 400 L 470 400 Z"/>
  <text class="g0" x="505" y="318" font-size="18" text-anchor="middle">&amp;</text>

  <!-- output resolves to a single decision -->
  <path class="ink ink-3 draw" stroke-width="1.6" d="M 607 305 L 720 305"/>
  <circle class="ink ink-2 draw" cx="742" cy="305" r="22" stroke-width="2"/>
  <text class="g1" x="742" y="312" font-size="18" text-anchor="middle">1</text>

  <!-- truth table, quietly under it all -->
  <g class="ink" stroke-width="1" opacity="0.7">
    <rect class="draw" x="470" y="452" width="150" height="96"/>
    <line class="draw" x1="520" y1="452" x2="520" y2="548"/>
    <line class="draw" x1="570" y1="452" x2="570" y2="548"/>
    <line class="draw" x1="470" y1="484" x2="620" y2="484"/>
    <line class="draw" x1="470" y1="516" x2="620" y2="516"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text class="g0" x="495" y="474">A</text><text class="g0" x="545" y="474">B</text><text class="g1" x="595" y="474">Q</text>
    <text class="g0" x="495" y="506">1</text><text class="g0" x="545" y="506">1</text><text class="g1" x="595" y="506">1</text>
    <text class="g0" x="495" y="538">1</text><text class="g0" x="545" y="538">0</text><text class="g0" x="595" y="538">0</text>
  </g>
</svg></div>
<script>
(function(){var root=document.documentElement;
 function theme(){try{var p=window.parent&&window.parent.document.documentElement;var t=(p&&p.getAttribute('data-theme'))||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.setAttribute('data-theme',t);}catch(e){root.setAttribute('data-theme','light');}}
 theme();try{var p=window.parent&&window.parent.document.documentElement;if(p)new MutationObserver(theme).observe(p,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
 function draw(){document.querySelectorAll('.draw').forEach(function(el,i){var len=(el.getTotalLength&&el.getTotalLength())||300;el.style.setProperty('--len',len);el.style.transition='none';el.style.strokeDashoffset=len;el.getBoundingClientRect();el.style.transition='stroke-dashoffset 1.7s cubic-bezier(0.16,1,0.3,1) '+(i*55)+'ms';el.style.strokeDashoffset='0';});}
 addEventListener('load',draw);setTimeout(draw,60);})();
</script></body></html>
