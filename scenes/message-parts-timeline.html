<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Message parts timeline</title>
<link rel="stylesheet" href="/scenes/ink-style.css"/>
</head>
<body><div class="stage"><svg id="s" viewBox="0 0 960 250" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="/scenes/ink-lib.js"></script>

})();
</script>
</body></html>
