<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Orchestration core inside workspace-mcp</title>
  <desc id="desc">Session loop coordinating policy engine, tool registry, patch bundler, and trace logs with deterministic outputs.</desc>
  <rect width="1200" height="420" fill="#efe5cf"/>

  <rect x="410" y="95" width="380" height="230" rx="18" fill="#ffffff" stroke="#c0663c" stroke-width="2"/>
  <text x="600" y="128" fill="#c0663c" font-size="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">workspace-mcp orchestration core</text>
  <text x="600" y="154" fill="#4b4a46" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">event stream -> decision -> action -> evidence</text>

  <rect x="455" y="175" width="130" height="55" rx="10" fill="#e4d6b8" stroke="#1b1a17"/>
  <rect x="615" y="175" width="130" height="55" rx="10" fill="#e4d6b8" stroke="#1b1a17"/>
  <rect x="455" y="245" width="130" height="55" rx="10" fill="#e4d6b8" stroke="#1b1a17"/>
  <rect x="615" y="245" width="130" height="55" rx="10" fill="#e4d6b8" stroke="#1b1a17"/>

  <text x="520" y="207" fill="#1b1a17" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Policy engine</text>
  <text x="680" y="207" fill="#1b1a17" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Tool registry</text>
  <text x="520" y="277" fill="#1b1a17" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Bundle/patch</text>
  <text x="680" y="277" fill="#1b1a17" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Trace + audit</text>

  <rect x="90" y="155" width="230" height="85" rx="12" fill="#ffffff" stroke="#1b1a17"/>
  <text x="205" y="192" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Model stream events</text>
  <text x="205" y="212" fill="#4b4a46" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reasoning | text | tool-call</text>

  <rect x="885" y="155" width="225" height="85" rx="12" fill="#ffffff" stroke="#1b1a17"/>
  <text x="997" y="192" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Structured response</text>
  <text x="997" y="212" fill="#4b4a46" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">meta + data + violation</text>

  <path d="M320 198 L410 198" stroke="#2a6f7f" stroke-width="4"/>
  <path d="M790 198 L885 198" stroke="#2a6f7f" stroke-width="4"/>

  <text x="600" y="362" fill="#4b4a46" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Contract invariants: meta.code == code, ISO8601 UTC timestamp, canonical violation payload.</text>
</svg>
