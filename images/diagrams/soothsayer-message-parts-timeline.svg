<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Message parts timeline</title>
  <desc id="desc">Compact event stream from reasoning to text, tool call, patch artifact, and step marker.</desc>
  <rect width="1200" height="300" fill="#efe5cf"/>

  <line x1="90" y1="150" x2="1110" y2="150" stroke="#1b1a17" stroke-width="4"/>

  <circle cx="170" cy="150" r="10" fill="#e8c77a"/>
  <circle cx="370" cy="150" r="10" fill="#2a6f7f"/>
  <circle cx="570" cy="150" r="10" fill="#6fa38f"/>
  <circle cx="770" cy="150" r="10" fill="#c0663c"/>
  <circle cx="970" cy="150" r="10" fill="#4b4a46"/>

  <rect x="120" y="70" width="100" height="36" rx="8" fill="#ffffff" stroke="#1b1a17"/>
  <text x="170" y="93" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reasoning</text>

  <rect x="325" y="200" width="90" height="36" rx="8" fill="#ffffff" stroke="#1b1a17"/>
  <text x="370" y="223" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">text</text>

  <rect x="520" y="70" width="100" height="36" rx="8" fill="#ffffff" stroke="#1b1a17"/>
  <text x="570" y="93" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tool</text>

  <rect x="720" y="200" width="100" height="36" rx="8" fill="#ffffff" stroke="#1b1a17"/>
  <text x="770" y="223" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">patch</text>

  <rect x="925" y="70" width="90" height="36" rx="8" fill="#ffffff" stroke="#1b1a17"/>
  <text x="970" y="93" fill="#1b1a17" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">step</text>

  <path d="M170 140 L170 106" stroke="#4b4a46" stroke-width="2"/>
  <path d="M370 160 L370 200" stroke="#4b4a46" stroke-width="2"/>
  <path d="M570 140 L570 106" stroke="#4b4a46" stroke-width="2"/>
  <path d="M770 160 L770 200" stroke="#4b4a46" stroke-width="2"/>
  <path d="M970 140 L970 106" stroke="#4b4a46" stroke-width="2"/>

  <text x="600" y="262" fill="#4b4a46" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Structured parts turn chat output into an inspectable execution timeline.</text>
</svg>
