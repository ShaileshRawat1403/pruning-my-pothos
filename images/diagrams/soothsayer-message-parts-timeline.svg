<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Message parts timeline</title>
  <desc id="desc">Compact event stream from reasoning to text, tool call, patch artifact, and step marker.</desc>
  <rect width="1200" height="300" fill="#0f172a"/>

  <line x1="90" y1="150" x2="1110" y2="150" stroke="#334155" stroke-width="4"/>

  <circle cx="170" cy="150" r="10" fill="#f59e0b"/>
  <circle cx="370" cy="150" r="10" fill="#60a5fa"/>
  <circle cx="570" cy="150" r="10" fill="#34d399"/>
  <circle cx="770" cy="150" r="10" fill="#fb7185"/>
  <circle cx="970" cy="150" r="10" fill="#a78bfa"/>

  <rect x="120" y="70" width="100" height="36" rx="8" fill="#111827" stroke="#475569"/>
  <text x="170" y="93" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reasoning</text>

  <rect x="325" y="200" width="90" height="36" rx="8" fill="#111827" stroke="#475569"/>
  <text x="370" y="223" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">text</text>

  <rect x="520" y="70" width="100" height="36" rx="8" fill="#111827" stroke="#475569"/>
  <text x="570" y="93" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tool</text>

  <rect x="720" y="200" width="100" height="36" rx="8" fill="#111827" stroke="#475569"/>
  <text x="770" y="223" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">patch</text>

  <rect x="925" y="70" width="90" height="36" rx="8" fill="#111827" stroke="#475569"/>
  <text x="970" y="93" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">step</text>

  <path d="M170 140 L170 106" stroke="#64748b" stroke-width="2"/>
  <path d="M370 160 L370 200" stroke="#64748b" stroke-width="2"/>
  <path d="M570 140 L570 106" stroke="#64748b" stroke-width="2"/>
  <path d="M770 160 L770 200" stroke="#64748b" stroke-width="2"/>
  <path d="M970 140 L970 106" stroke="#64748b" stroke-width="2"/>

  <text x="600" y="262" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Structured parts turn chat output into an inspectable execution timeline.</text>
</svg>
