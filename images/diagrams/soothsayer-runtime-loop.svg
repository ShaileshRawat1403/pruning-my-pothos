<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Runtime control loop</title>
  <desc id="desc">User request enters planner, runtime checks policy, executes tools, verifies outputs, records trace, then decides next step.</desc>
  <rect width="1200" height="420" fill="#0f172a"/>

  <rect x="55" y="160" width="150" height="90" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="250" y="160" width="170" height="90" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="470" y="145" width="230" height="120" rx="14" fill="#111827" stroke="#f97316" stroke-width="2"/>
  <rect x="750" y="160" width="145" height="90" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="940" y="160" width="180" height="90" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="130" y="198" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">User</text>
  <text x="130" y="218" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">request</text>

  <text x="335" y="198" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LLM</text>
  <text x="335" y="218" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">proposes action</text>

  <text x="585" y="182" fill="#fdba74" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Session loop</text>
  <text x="585" y="205" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">policy check</text>
  <text x="585" y="223" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">allow / deny / ask</text>
  <text x="585" y="241" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">run_id | owner_id | audit_id</text>

  <text x="822" y="198" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Tool</text>
  <text x="822" y="218" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">execution</text>

  <text x="1030" y="198" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Verification +</text>
  <text x="1030" y="218" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">trace record</text>

  <path d="M205 205 L250 205 M420 205 L470 205 M700 205 L750 205 M895 205 L940 205" stroke="#38bdf8" stroke-width="4"/>
  <path d="M1030 250 C1030 330, 590 350, 585 265" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <text x="840" y="340" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">next step decision: continue | stop | compact</text>
</svg>
